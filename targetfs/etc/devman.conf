# devman configuration file for auxv6
# Device node policy rules
#
# Global options:
debug=0
# Set to 1 for verbose per-node logs.
#
# Policy rule format:
#   <glob-pattern>  <octal-mode>
#
# Pattern is matched against the full device path (e.g. /dev/tty0).
# The first matching rule wins.  Lines starting with '#' are comments.
# If no rule matches, built-in defaults apply.

# PTY master multiplexer
/dev/ptmx       0666

# PTY slave devices
/dev/pts/*      0620

# Virtual console TTYs
/dev/tty*       0620

# System console (root only)
/dev/console    0600
/dev/fb0        0600
/dev/mouse0     0600

# Null and zero devices (world-accessible)
/dev/null       0666
/dev/zero       0666

# Block devices (owner+group only)
/dev/hd*        0660
/dev/vd*        0660
/dev/nd*        0660
/dev/loop*      0660
/dev/cdrom*     0444
