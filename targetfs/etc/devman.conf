# devman configuration file for auxv6
# Device node patterns and their permissions
#
# Global options:
debug=0
# Set to 1 for verbose per-node logs.
#
# Format:
# pattern  type  major[:minor]  mode  uid:gid  [command]
#
# This file is optional - devman includes sensible built-in rules
# for common auxv6 devices (block devices, PTYs, TTYs, etc).
#
# Override rules by adding entries here.

# Example: Block device rules
# hda      blk   2:0            0660  0:0
# vda      blk   2:8            0660  0:0
# loop*    blk   2:40           0660  0:0

# Example: Character device rules  
# console  chr   1:1            0600  0:0
# null     chr   1:3            0666  0:0
# pts/*    chr   3              0620  0:0
